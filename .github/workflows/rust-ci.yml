name: Rust CI

on:
  push:
    branches: [ main, develop]
    paths:
      - 'src/**'
      - 'tests/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --verbose
    

  lint:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  cli-integration-tests:
    runs-on: macos-15-intel
    needs: [build]
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [ios, android]
      fail-fast: false
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install idb-companion via Homebrew
        run: |
          brew tap facebook/fb
          brew install idb-companion

      - name: Install Python idb CLI
        run: pip install fb-idb

      # iOS specific steps
      - name: Boot iOS simulator
        if: matrix.platform == 'ios'
        id: boot_simulator
        run: |
          set -e
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-F0-9-]{36}" | head -1)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "ERROR: No iPhone simulator found"
            exit 1
          fi
          echo "Selected simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || {
            if xcrun simctl list devices booted | grep -q "$SIMULATOR_UDID"; then
              echo "Simulator already booted: $SIMULATOR_UDID"
            else
              echo "ERROR: Failed to boot simulator"
              exit 1
            fi
          }
          echo "Waiting for simulator boot to complete..."
          sleep 10
          if ! xcrun simctl list devices booted | grep -q "$SIMULATOR_UDID"; then
            echo "ERROR: Simulator boot verification failed"
            exit 1
          fi
          echo "Simulator booted successfully: $SIMULATOR_UDID"

      - name: Setup iOS test environment
        if: matrix.platform == 'ios'
        run: mise run test-setup

      - name: Run iOS CLI integration tests
        if: matrix.platform == 'ios'
        run: cargo test --test cli -- --test-threads=1

      # Android specific steps
      - name: Run Android tests with Emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Waiting for Android emulator to be ready..."
            adb wait-for-device
            adb shell input keyevent 82
            adb shell getprop sys.boot_completed
            mise run test-setup
            cargo test --test cli -- --test-threads=1

      # Cleanup
      - name: Cleanup on failure (iOS)
        if: failure() && matrix.platform == 'ios'
        run: |
          echo "=== Simulator Status ==="
          xcrun simctl list devices booted || true
          echo "=== idb Targets ==="
          idb list-targets --json || true
          echo "=== Recent Logs ==="
          tail -100 ~/Library/Logs/idb_companion.log || true

      - name: Cleanup on failure (Android)
        if: failure() && matrix.platform == 'android'
        run: |
          echo "=== Android Devices ==="
          adb devices -l || true
          echo "=== System Properties ==="
          adb shell getprop || true
          echo "=== Logcat (last 100 lines) ==="
          adb logcat -d -t 100 || true
