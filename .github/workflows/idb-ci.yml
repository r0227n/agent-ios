name: IDB Command CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/idb/**'
      - 'src/grpc/**'
      - 'src/platform/ios/**'
      - 'src/types/**'
      - 'src/companion/**'
      - 'src/core/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/idb/**'
      - '.github/workflows/idb-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/idb/**'
      - 'src/grpc/**'
      - 'src/platform/ios/**'
      - 'src/types/**'
      - 'src/companion/**'
      - 'src/core/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/idb/**'
      - '.github/workflows/idb-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-validation:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --verbose

    - name: Verify CLI help
      run: |
        ./target/debug/agent-mobile --help
        ./target/debug/agent-mobile idb --help

    - name: Test list-targets without companion
      run: |
        # This may succeed or fail depending on simctl availability
        # We just verify the command runs without crashing
        ./target/debug/agent-mobile idb list-targets || true

  unit-tests:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    - name: Install idb-companion via Homebrew
      run: |
        brew tap facebook/fb
        brew install idb-companion

    - name: Run unit tests
      run: cargo test --verbose --bins

  integration-tests:
    runs-on: macos-15-intel
    needs: [cli-validation]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    - name: Install idb-companion via Homebrew
      run: |
        brew tap facebook/fb
        brew install idb-companion

    - name: Install Python idb CLI
      run: pip install fb-idb

    - name: Setup test environment
      run: mise run test-setup

    - name: Run integration tests
      run: cargo test --test idb -- --test-threads=1
