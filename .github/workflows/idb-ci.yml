name: IDB Command CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/cli/idb/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/cli/idb/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-validation:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --verbose

    - name: Verify CLI help
      run: |
        ./target/debug/agent-mobile --help
        ./target/debug/agent-mobile idb --help

    - name: Test list-targets without companion
      run: |
        # This may succeed or fail depending on simctl availability
        # We just verify the command runs without crashing
        ./target/debug/agent-mobile idb list-targets || true

  unit-tests:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run unit tests
      run: cargo test --verbose

  integration-tests:
    runs-on: macos-15-intel
    needs: [cli-validation]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install idb-companion via Homebrew
      run: |
        brew tap facebook/fb
        brew install idb-companion

    - name: Install Python idb client
      run: |
        pip install fb-idb

    - name: Verify idb installation
      run: |
        which idb
        idb --version || true
        which idb_companion
        idb_companion --version || true

    - name: List available simulators
      run: |
        xcrun simctl list devices available

    - name: Boot iOS Simulator
      run: |
        # Get the first available iPhone simulator UDID
        SIMULATOR_UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-F0-9-]{36}")
        echo "SIMULATOR_UDID=${SIMULATOR_UDID}" >> $GITHUB_ENV

        if [ -z "$SIMULATOR_UDID" ]; then
          echo "No iPhone simulator found, creating one..."
          RUNTIME=$(xcrun simctl list runtimes | grep -m1 "iOS" | awk '{print $NF}')
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-15"
          SIMULATOR_UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=${SIMULATOR_UDID}" >> $GITHUB_ENV
        fi

        echo "Booting simulator: $SIMULATOR_UDID"
        xcrun simctl boot "$SIMULATOR_UDID" || true

        # Wait for simulator to be ready
        sleep 10
        xcrun simctl list devices | grep Booted

    - name: Start idb_companion
      run: |
        # Start idb_companion for the booted simulator
        idb_companion --udid "$SIMULATOR_UDID" &

        # Wait for companion to initialize
        sleep 5

        # Verify companion is running
        ls -la /tmp/idb/ || true
        cat /tmp/idb/state || true

    - name: Build project
      run: cargo build --verbose

    - name: Verify Python idb works
      run: |
        idb list-targets || echo "Python idb list-targets check complete"

    - name: Run integration tests
      run: |
        cargo test --test '*_integration' --verbose -- --test-threads=1
      continue-on-error: true

    - name: Cleanup - Shutdown simulator
      if: always()
      run: |
        xcrun simctl shutdown "$SIMULATOR_UDID" || true
