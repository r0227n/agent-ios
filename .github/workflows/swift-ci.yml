name: Swift CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/xcuitest-runner/**'
      - '.github/workflows/swift-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/xcuitest-runner/**'
      - '.github/workflows/swift-ci.yml'

jobs:
  lint:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Lint & format check (swift-format)
        working-directory: crates/xcuitest-runner
        run: swift-format lint -r --strict .
