name: Docs Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Select stable Rust
        run: rustup default stable

      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps

      - name: Prepare docs for Pages root
        run: |
          doc_root="target/doc"
          crate_name="agent_mobile"
          crate_root="$doc_root/$crate_name"

          test -f "$crate_root/index.html"

          tmp_list="$(mktemp)"
          (
            cd "$crate_root"
            find . -type f -name '*.html' | sed 's#^\./##'
          ) > "$tmp_list"

          cp -R "$crate_root/." "$doc_root/"

          while IFS= read -r rel_path; do
            target_file="$doc_root/$rel_path"
            perl -0pi -e '
              sub reduce_prefix {
                my ($prefix) = @_;
                $prefix =~ s{^\.\./}{};
                return $prefix eq q{} ? q{./} : $prefix;
              }

              s{((?:href|src)=["'"'"'])((?:\.\./)+)(static\.files/|src/|crates\.js)}
               {$1 . reduce_prefix($2) . $3}gex;

              s{((?:href|src)=["'"'"'])((?:\.\./)+)agent_mobile/index\.html}
               {$1 . reduce_prefix($2) . q{index.html}}gex;

              s{data-root-path="((?:\.\./)+)"}
               {q{data-root-path="} . reduce_prefix($1) . q{"}}gex;

              s{data-static-root-path="((?:\.\./)+)static\.files/"}
               {q{data-static-root-path="} . reduce_prefix($1) . q{static.files/"}}gex;
            ' "$target_file"
          done < "$tmp_list"

          rm -f "$tmp_list"

      - name: Ensure rustdoc root exists
        run: test -f target/doc/index.html

      - name: Disable Jekyll processing
        run: touch target/doc/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: target/doc

  deploy:
    runs-on: macos-26
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
