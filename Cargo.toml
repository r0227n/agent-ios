[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform-ios",
    "crates/platform-android",
    "crates/gateway",
]

[package]
name = "agent-mobile"
version = "0.1.0"
edition = "2021"
description = "AI-friendly mobile automation CLI for iOS simulators and Android devices"
license = "MIT"
repository = "https://github.com/r0227n/agent-mobile"
homepage = "https://github.com/r0227n/agent-mobile"
documentation = "https://r0227n.github.io/agent-mobile/"
readme = "README.md"

[[bin]]
name = "agent-mobile"
path = "src/main.rs"

[dependencies]
# Workspace crates
agent-mobile-core = { version = "0.1.0", path = "crates/core", features = ["cli"] }
agent-mobile-platform-ios = { version = "0.1.0", path = "crates/platform-ios" }
agent-mobile-platform-android = { version = "0.1.0", path = "crates/platform-android" }
agent-mobile-gateway = { version = "0.1.0", path = "crates/gateway" }

# Async runtime
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "process"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Unix signal handling
nix = { version = "0.29", features = ["signal", "process"] }

# Temporary files
tempfile = "3.19"

# Shell parsing (for shell command)
shlex = "1.3"

# Archive extraction (for instruments/xctrace)
flate2 = "1.0"
tar = "0.4"

# Regex (for time format parsing)
regex = "1"

# Async traits
async-trait = "0.1"

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Image format conversion (PNG → JPEG)
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Unique ID generation
nanoid = "0.4"

[dev-dependencies]
tempfile = "3.19"
chrono = "0.4"
