[package]
name = "agent-mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
# gRPC/Protobuf
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-stream = "0.1"

# Unix Domain Socket support for tonic
tower = "0.4"
hyper-util = "0.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.19"
