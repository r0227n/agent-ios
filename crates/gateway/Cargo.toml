[package]
name = "agent-mobile-gateway"
version = "0.1.0"
edition = "2021"
description = "High-level API gateway for agent-mobile"

[dependencies]
agent-mobile-core = { path = "../core" }
agent-mobile-platform-android = { path = "../platform-android" }

# Async runtime
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
