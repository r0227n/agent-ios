[package]
name = "agent-mobile-platform-ios"
version = "0.1.0"
edition = "2021"
description = "iOS platform implementation for agent-mobile"

[dependencies]
agent-mobile-core = { path = "../core" }

# Async runtime
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "process"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Plist parsing (for simctl listapps output)
plist = "1"

# Regex
regex = "1"

# Logging
tracing = "0.1"

# HTTP client for XCUITest Runner
reqwest = { version = "0.12", features = ["json"] }

# Archive extraction (for trace files)
flate2 = "1.0"
tar = "0.4"

