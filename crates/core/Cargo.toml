[package]
name = "agent-mobile-core"
version = "0.1.0"
edition = "2021"
description = "Core types and traits for agent-mobile"

[features]
default = []
cli = ["clap"]
tonic = ["dep:tonic"]

[dependencies]
# gRPC (optional)
tonic = { version = "0.12", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
