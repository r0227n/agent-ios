[package]
name = "agent-mobile-platform-android"
version = "0.1.0"
edition = "2021"
description = "Android platform implementation for agent-mobile"

[dependencies]
agent-mobile-core = { path = "../core" }

# ADB protocol client (TCP :5037 direct communication)
adb_client = "2.0"

# Async runtime
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "process", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Regex
regex = "1"

# UUID for unique file names
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
