[tools]
# Rust toolchain
rust = "1.92.0"

# Build tools
"cargo:cargo-watch" = "8.5.3"
"cargo:cargo-edit" = "0.13.8"

[tasks]
build = "cargo build"
test = "cargo test"
lint = "cargo clippy -- -D warnings"
format = "cargo fmt --all"
format-check = "cargo fmt --all -- --check"

# Swift tasks (xcuitest-runner)
"swift:lint" = "cd crates/xcuitest-runner && swift-format lint -r --strict ."
"swift:format" = "cd crates/xcuitest-runner && swift-format format -i -r ."
"swift:format:check" = "cd crates/xcuitest-runner && swift-format lint -r --strict ."

setup = """
git config gtr.defaultBranch develop
claude mcp reset-project-choices
"""

test-setup = """
#!/bin/bash
set -e

echo "=== Setting up test environment ==="

# 1. Check Xcode command line tools
if ! command -v xcrun &> /dev/null; then
    echo "Error: Xcode command line tools not found. Install with: xcode-select --install"
    exit 1
fi

# 2. Find a booted simulator
SIMULATOR_UDID=$(xcrun simctl list devices booted -j | python3 -c "
import sys, json
data = json.load(sys.stdin)
for runtime, devices in data.get('devices', {}).items():
    for device in devices:
        if device.get('state') == 'Booted':
            print(device['udid'])
            sys.exit(0)
sys.exit(1)
" 2>/dev/null) || true

if [ -z "$SIMULATOR_UDID" ]; then
    echo "No booted simulator found. Starting one..."
    # Find first available iPhone simulator
    SIMULATOR_UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-Fa-f0-9-]{36}" | head -1)
    if [ -z "$SIMULATOR_UDID" ]; then
        echo "Error: No iPhone simulator found"
        exit 1
    fi
    echo "Booting simulator: $SIMULATOR_UDID"
    xcrun simctl boot "$SIMULATOR_UDID"
    sleep 5
fi

echo "Using simulator: $SIMULATOR_UDID"

# 3. Build MockApp if needed
if [ ! -d "tests/fixtures/MockApp.app" ]; then
    echo "Building MockApp..."
    ./tests/fixtures/MockApp/build.sh
fi

echo "=== Test environment ready ==="
echo "Run tests with: cargo test --tests -- --test-threads=1"
"""
